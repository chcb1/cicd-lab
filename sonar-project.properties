# Copy both values from SonarQube Cloud: project > Information.
sonar.organization=chcb1
sonar.projectKey=chcb1_cicd-lab

sonar.sources=app
sonar.tests=tests
sonar.python.version=3.13
# Produced by pytest (see pyproject.toml).
sonar.python.coverage.reportPaths=coverage.xml

# Wait for the quality gate result and fail the step if the gate fails.
sonar.qualitygate.wait=true
