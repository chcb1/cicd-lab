name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

# A new push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit SHA; the comment shows the matching tag.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests with coverage
        run: pytest

  docker-build:
    name: Build image (no push yet)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t task-api:${{ github.sha }} .

      - name: Smoke test the container
        run: |
          docker run -d --name task-api -p 8000:8000 task-api:${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then
              echo
              curl -fsS http://localhost:8000/version
              exit 0
            fi
            sleep 1
          done
          docker logs task-api
          exit 1
